name: hr-flow-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: hrflow
      POSTGRES_DB: hrflow
    ports:
      - "5432:5432"
    volumes:
      - hrflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow -d hrflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hrflow:hrflow@db:5432/hrflow?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3000:3000"
    # Run migrations + seed on first boot, then start the server.
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seed.js 2>/dev/null || true;
             node server.js"

volumes:
  hrflow_pg:
